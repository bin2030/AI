<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 BLE 控制器</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { margin: 0; background: #030712; color: #e2e8f0; font-family: monospace; }
        .container { padding: 20px; max-width: 400px; margin: auto; }
        .card { background: rgba(30,41,59,0.5); border: 1px solid #334155; padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        input[type="text"] { width: 100%; padding: 8px; background: #0f172a; border: 1px solid #38bdf8; color: #4ade80; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; margin-top: 10px; cursor: pointer; border-radius: 6px; font-weight: bold; }
        .btn-connect { background: #38bdf820; color: #38bdf8; border: 1px solid #38bdf8; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef } = React;

        function App() {
            const [targetName, setTargetName] = useState("ESP32-Servo-BLE");
            const [connected, setConnected] = useState(false);
            const [log, setLog] = useState("等待連線...");

            const BLE_SERVICE = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";

            const connectBLE = async () => {
                try {
                    setLog("正在搜尋：" + targetName);
                    const device = await navigator.bluetooth.requestDevice({
                        filters: [{ name: targetName }, { services: [BLE_SERVICE] }],
                        optionalServices: [BLE_SERVICE]
                    });
                    const server = await device.gatt.connect();
                    setConnected(true);
                    setLog("✅ 已連線至 " + device.name);
                } catch (err) {
                    setLog("❌ 錯誤: " + err.message);
                }
            };

            return (
                <div className="container">
                    <h2 style={{color:'#38bdf8', textAlign:'center'}}>BLE 控制面板</h2>
                    <div className="card">
                        <label style={{fontSize:'12px', color:'#94a3b8'}}>設定裝置連線名稱：</label>
                        <input 
                            type="text" 
                            value={targetName} 
                            onChange={(e) => setTargetName(e.target.value)}
                        />
                        <button className="btn-connect" onClick={connectBLE}>
                            {connected ? "中斷連線" : "開始連線"}
                        </button>
                    </div>
                    <div className="card" style={{fontSize:'12px', background:'#000'}}>
                        {log}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
